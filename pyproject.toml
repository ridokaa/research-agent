[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentic-loop"
version = "0.1.0"
description = "Agentic Loop — A research agent that thinks, executes, and stops when it has a final answer."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "httpx>=0.27.0",
    "structlog>=24.1.0",
    "tenacity>=8.3.0",
    "python-dotenv>=1.0.1",
    "orjson>=3.10.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
    "jsonschema>=4.20.0",
    "mcp>=2.0.0",
]


[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "live: marks tests that make real network calls (deselect with '-m not live')",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]
